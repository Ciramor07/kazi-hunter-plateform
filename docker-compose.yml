version: '3.9'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: kazi-ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped

  scraper:
    build: ./scraper
    container_name: kazi-scraper
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    restart: "no"

  dashboard:
    build: ./dashboard
    container_name: kazi-dashboard
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    environment:
      - DB_PATH=/app/data/kazi.db
    restart: unless-stopped

volumes:
  ollama_data:
