name: CI — Kazi Hunter

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:

  lint:
    name: 🔍 Lint Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install flake8
        run: pip install flake8

      - name: Lint
        run: |
          flake8 scraper/ generator/ dashboard/ \
            --max-line-length=100 \
            --exclude=__pycache__ \
            --count \
            --statistics
        continue-on-error: true

  docker-build:
    name: 🐳 Docker Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Build scraper
        run: |
          [ -f scraper/Dockerfile ] && \
          docker build -t kazi-scraper:ci ./scraper || \
          echo "Dockerfile scraper pas encore créé — skip"

      - name: Build dashboard
        run: |
          [ -f dashboard/Dockerfile ] && \
          docker build -t kazi-dashboard:ci ./dashboard || \
          echo "Dockerfile dashboard pas encore créé — skip"