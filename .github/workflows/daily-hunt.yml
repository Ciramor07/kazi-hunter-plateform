name: 🎯 Kazi Daily Hunt

on:
  schedule:
    - cron: '0 7 * * 1-5'
  workflow_dispatch:

jobs:
  scrape-and-score:
    name: 🔍 Scrape + Score
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix permissions
        run: mkdir -p /home/ricky/kazi-data && sudo chown -R ricky:ricky /home/ricky/kazi-data/

      - name: Build scraper
        run: docker compose build scraper

      - name: Run scraper + scorer
        run: |
          cd scraper
          OLLAMA_HOST=http://localhost:11434 \
          DB_PATH=/home/ricky/kazi-data/kazi.db \
          python main.py

      - name: Done
        run: echo "✅ Kazi Hunt terminé !"
