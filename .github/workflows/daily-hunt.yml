name: 🎯 Kazi Daily Hunt

on:
  schedule:
    - cron: '0 7 * * 1-5'  # Lundi-Vendredi à 7h00 UTC (8h Paris)
  workflow_dispatch:         # Lancement manuel possible

jobs:
  scrape-and-score:
    name: 🔍 Scrape + Score
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build scraper
        run: docker compose build scraper

      - name: Run scraper
        run: |
          docker compose run --rm scraper python main.py
        env:
          OLLAMA_HOST: http://localhost:11434
          DB_PATH: /home/ricky/kazi-hunter/data/kazi.db

      - name: Score offers
        run: |
          cd scraper
          OLLAMA_HOST=http://localhost:11434 \
          DB_PATH=/home/ricky/kazi-hunter/data/kazi.db \
          python scorer.py

      - name: Done
        run: echo "✅ Kazi Hunt terminé !"
