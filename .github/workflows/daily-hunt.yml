name: 🎯 Kazi Daily Hunt

on:
  schedule:
    - cron: '0 7 * * 1-5'
  workflow_dispatch:

jobs:
  scrape-and-score:
    name: 🔍 Scrape + Score
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare DB folder
        run: mkdir -p /home/ricky/kazi-data

      - name: Build scraper
        run: docker build -t kazi-scraper ./scraper

      - name: Run scraper + scorer
        run: |
          docker run --rm \
            --network host \
            -e OLLAMA_HOST=http://localhost:11434 \
            -e DB_PATH=/kazi-data/kazi.db \
            -v /home/ricky/kazi-data:/kazi-data \
            kazi-scraper python main.py

      - name: Done
        run: echo "✅ Kazi Hunt terminé !"
