name: 🎯 Kazi Daily Hunt

on:
  schedule:
    - cron: '0 7 * * 1-5'
  workflow_dispatch:

jobs:
  scrape-and-score:
    name: 🔍 Scrape + Score
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare DB folder
        run: mkdir -p /home/ricky/kazi-data

      - name: Build scraper
        run: docker compose build scraper

      - name: Run scraper + scorer
        run: |
          docker compose run --rm \
            -e OLLAMA_HOST=http://172.17.0.1:11434 \
            -e DB_PATH=/kazi-data/kazi.db \
            -v /home/ricky/kazi-data:/kazi-data \
            scraper python main.py

      - name: Done
        run: echo "✅ Kazi Hunt terminé !"
